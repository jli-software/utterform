name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-aarch64
            macos_target: "11.0"
          - os: macos-15-intel
            platform: macos-x86_64
            macos_target: "10.15"
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target || '10.15' }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libasound2-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Test production GUI
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: ui-test-results
          path: test-results/
          retention-days: 14

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Linux application with system libraries
        if: runner.os == 'Linux'
        run: npm run tauri build -- --no-bundle
      - name: Package and verify Linux build
        if: runner.os == 'Linux'
        run: |
          scripts/package-linux-system.sh
          install -m 755 scripts/install-linux.sh release/install-linux.sh
          node scripts/checksums.mjs release
          scripts/test-linux-system-package.sh release

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis
      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/utterform.exe release/utterform-windows-x86_64.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/utterform-windows-x86_64-setup.exe

      - name: Build macOS app and disk image
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app,dmg
      - name: Package macOS binaries
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/dmg/*.dmg "release/utterform-${{ matrix.platform }}.dmg"
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/Utterform.app "release/utterform-${{ matrix.platform }}.app.zip"

      - name: Checksum binaries
        run: node scripts/checksums.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: utterform-binaries-${{ matrix.platform }}
          path: release/
          if-no-files-found: error
          retention-days: 30

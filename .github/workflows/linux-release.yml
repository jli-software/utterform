name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

  build:
    needs: validate
    uses: ./.github/workflows/desktop-builds.yml

  publish:
    name: Publish verified desktop binaries
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: utterform-binaries-*
          path: release
          merge-multiple: true
      - name: Verify asset set and create combined checksums
        run: |
          for asset in utterform-linux-x86_64-system.tar.gz install-linux.sh utterform-windows-x86_64.exe utterform-windows-x86_64-setup.exe utterform-macos-aarch64.dmg utterform-macos-aarch64.app.zip; do
            test -s "release/$asset" || { echo "Missing asset: $asset"; exit 1; }
          done
          node scripts/checksums.mjs release
          cd release
          sha256sum -c SHA256SUMS.txt
      - name: Publish release after every platform passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          read -r title < "$notes"
          title="${title#\# }"
          flags=()
          latest=true
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
            latest=false
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft "${flags[@]}" \
            --title "$title" --notes-file "$notes"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"

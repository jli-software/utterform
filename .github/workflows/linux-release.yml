name: Release

on:
  push:
    tags:
      - "v*-alpha.*"
      - "v*-beta.*"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified desktop binaries
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: utterform-binaries-*
          path: release
          merge-multiple: true
      - name: Verify asset set and create combined checksums
        run: |
          for asset in utterform-linux-x86_64-system.tar.gz install-linux.sh utterform-windows-x86_64.exe utterform-windows-x86_64-setup.exe utterform-macos-aarch64.dmg utterform-macos-aarch64.app.zip utterform-macos-x86_64.dmg utterform-macos-x86_64.app.zip; do
            test -s "release/$asset" || { echo "Missing asset: $asset"; exit 1; }
          done
          node scripts/checksums.mjs release
          cd release
          sha256sum -c SHA256SUMS.txt
      - name: Publish prerelease after every platform passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          read -r title < "$notes"
          title="${title#\# }"
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease \
            --title "$title" --notes-file "$notes"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

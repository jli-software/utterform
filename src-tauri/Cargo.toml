[package]
name = "utterform"
version = "0.7.0"
description = "Fast, lightweight voice-to-text transformation for the desktop"
authors = ["Jonas"]
edition = "2024"
license = "MIT"

[lib]
name = "utterform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
cpal = "0.18.2"
futures-util = "0.3.31"
hound = "3.5.1"
keyring = "4.2.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-notification = "2.3.4"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3.23.0"
whisper-rs = "0.16.0"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
# Tauri's tray uses libayatana-appindicator, which exposes no Activate method,
# so a left click on the tray icon can never reach the app. Serve the
# StatusNotifierItem ourselves instead.
# Deliberately not ksni's "tokio" feature: it turns on zbus/tokio for the whole
# build, and zbus' blocking API then drives a tokio runtime. The OS keyring uses
# that API from inside Tauri's async runtime, which panics with "Cannot start a
# runtime from within a runtime". async-io's block_on parks the thread instead.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "5.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_Security", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Typing at the cursor posts keyboard events through CoreGraphics; the frontmost
# application is read from AppKit for the log. Both crates are already in the
# build through Tauri, so this adds no new code to compile.
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[package]
name = "utterform"
version = "0.2.0"
description = "Fast, lightweight voice-to-text transformation for the desktop"
authors = ["Jonas"]
edition = "2024"
license = "MIT"

[lib]
name = "utterform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
cpal = "0.18.2"
futures-util = "0.3.31"
hound = "3.5.1"
keyring = "4.2.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.4.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tempfile = "3.23.0"
whisper-rs = "0.16.0"
